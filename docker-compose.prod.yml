services:
  fastapi-service-analyze:
    build:
      context: ./backend
    container_name: fastapi-service-analyze
    networks:
      - server-network
    restart: always

  nginx:
    build:
      context: ./web
    env_file:
      - ./backend/.env
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html
      - ./web/template.nginx.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - server-network
    restart: always
    depends_on:
      - fastapi-service-analyze

networks:
  server-network:
    driver: bridge
