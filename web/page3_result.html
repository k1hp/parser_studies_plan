<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Результат сравнения</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="content">
        <header>
            <h1>Результат сравнения</h1>
        </header>
        
        <div class="result" id="result">
            <div id="errorMessage" class="error-message"></div>
            <div id="resultContent"></div>
        </div>
        
        <div class="conteiner result-buttons">
            <button class="btn submitBtn" onclick="window.location.href = '/'">Назад к форме</button>
            <button class="btn submitBtn" onclick="downloadReport('pdf')">📄 Скачать PDF</button>
            <button class="btn submitBtn" onclick="downloadReport('html')">🌐 Скачать HTML</button>
        </div>
    </div>

    <script>
        const resultContainer = document.getElementById('resultContent');
        const errorMessageDiv = document.getElementById('errorMessage');

        // Экранирование HTML
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Показать ошибку
        function showError(message) {
            errorMessageDiv.style.display = 'block';
            errorMessageDiv.innerHTML = 'Ошибка: ' + message;
            resultContainer.innerHTML = '';
        }

        // Форматирование значения для отображения
        function formatValue(value) {
            if (value === null || value === undefined || value === '') {
                return '<span style="color: #999;">—</span>';
            }
            if (typeof value === 'boolean') {
                return value ? '✓ Есть' : '✗ Нет';
            }
            if (Array.isArray(value)) {
                if (value.length === 0) {
                    return '<span class="discrepancy-success">✅ Все в наличии</span>';
                }
                let html = '<ul style="margin: 5px 0 0 20px;">';
                value.forEach(item => {
                    if (typeof item === 'object' && item !== null) {
                        let displayText = item.discipline_name + (item.discipline_code ? ` (${item.discipline_code})` : '');
                        html += '<li>' + escapeHtml(displayText) + '</li>';
                    } else {
                        html += '<li>' + escapeHtml(String(item)) + '</li>';
                    }
                });
                html += '</ul>';
                return html;
            }
            if (typeof value === 'object') {
                return escapeHtml(JSON.stringify(value));
            }
            return escapeHtml(String(value));
        }

        // Форматирование названия поля
        function formatFieldName(key) {
            const names = {
                'specialty': 'Специальность',
                'discipline_code': 'Код направления',
                'curriculum_year': 'Год набора',
                'lvl_education': 'Уровень образования',
                'form_education': 'Форма обучения',
                'education_program': 'Образовательная программа',
                'calendar_graphic': 'Календарный учебный график',
                'education_plan': 'Учебный план',
                'working_programs': 'Рабочие программы дисциплин',
                'fos_materials': 'ФОС материалы',
                'practic_programs': 'Программы практик',
                'methodical_materials': 'Методические материалы',
                'gia_program': 'ГИА',
                'education_program_vosp': 'Рабочая программа воспитания',
                'curriculum_plan': 'Календарный план воспитательной работы'
            };
            return names[key] || key.replace(/_/g, ' ');
        }

        // Отображение результата
        function displayResult(data) {
            if (!data) {
                showError('Нет данных для отображения');
                return;
            }

            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch(e) {
                    resultContainer.innerHTML = '<pre>' + escapeHtml(data) + '</pre>';
                    return;
                }
            }

            let html = '<div style="padding: 10px;">';

            // ========== ОСНОВНАЯ ИНФОРМАЦИЯ ==========
            html += '<div class="info-block">';
            html += '<h3>Основная информация</h3>';
            const mainFields = ['specialty', 'discipline_code', 'curriculum_year', 'lvl_education', 'form_education'];
            for (const field of mainFields) {
                let value = data[field];
                html += `<div class="info-field"><strong>${formatFieldName(field)}:</strong> ${formatValue(value)}</div>`;
            }
            html += '</div>';

            // ========== НАЛИЧИЕ РАЗДЕЛОВ ==========
            html += '<div class="info-block">';
            html += '<h3>Наличие разделов в учебном плане</h3>';
            const sectionFields = ['education_program', 'calendar_graphic', 'education_plan', 'gia_program', 'education_program_vosp', 'curriculum_plan'];
            for (const field of sectionFields) {
                let value = data[field];
                let displayValue = (value === true || value === 'true') ? '✓ Есть' : '✗ Нет';
                html += `<div class="info-field"><strong>${formatFieldName(field)}:</strong> ${displayValue}</div>`;
            }
            html += '</div>';

            // ========== ФУНКЦИЯ ДЛЯ ОТОБРАЖЕНИЯ СЕКЦИЙ С РАСХОЖДЕНИЯМИ ==========
            function renderSection(title, fieldName, successMessage, bgColor) {
                let fieldData = data[fieldName];
                let hasField = fieldData !== undefined && fieldData !== null;
                let isEmptyArray = hasField && Array.isArray(fieldData) && fieldData.length === 0;
                let hasItems = hasField && Array.isArray(fieldData) && fieldData.length > 0;
                
                html += `<div class="discrepancy-section" style="background: ${bgColor};">`;
                html += `<h3>${title}</h3>`;
                
                if (!hasField) {
                    html += `<div class="discrepancy-unknown">⚠️ Информация отсутствует в ответе сервера</div>`;
                } else if (isEmptyArray) {
                    html += `<div class="discrepancy-success">✅ ${successMessage}</div>`;
                } else if (hasItems) {
                    html += `<div class="discrepancy-warning">⚠️ Найдены расхождения:</div>`;
                    fieldData.forEach((item, idx) => {
                        if (typeof item === 'object' && item !== null) {
                            let displayText = item.discipline_name || item.name || item;
                            let code = item.discipline_code || item.code || '';
                            if (code) {
                                html += `<div class="discrepancy-item">
                                            ${idx + 1}. ${escapeHtml(displayText)} 
                                            <span class="discrepancy-code">${escapeHtml(code)}</span>
                                        </div>`;
                            } else {
                                html += `<div class="discrepancy-item">${idx + 1}. ${escapeHtml(displayText)}</div>`;
                            }
                        } else {
                            html += `<div class="discrepancy-item">${idx + 1}. ${escapeHtml(String(item))}</div>`;
                        }
                    });
                } else {
                    html += `<div class="discrepancy-unknown">⚠️ Неожиданный формат данных</div>`;
                }
                html += '</div>';
            }

            // ========== ОТОБРАЖЕНИЕ ВСЕХ СЕКЦИЙ ==========
            renderSection('Рабочие программы дисциплин', 'working_programs', 'Все рабочие программы дисциплин в наличии', '#fff3e0');
            renderSection('ФОС материалы', 'fos_materials', 'Все ФОС материалы в наличии', '#e8f5e9');
            renderSection('Программы практик', 'practic_programs', 'Все программы практик в наличии', '#e3f2fd');
            renderSection('Методические материалы', 'methodical_materials', 'Все методические материалы в наличии', '#fce4ec');

            html += '</div>';
            resultContainer.innerHTML = html;
        }

        // Скачивание отчета
        window.downloadReport = async function(format) {
            const button = event.target;
            const originalText = button.innerText;

            try {
                const savedResult = localStorage.getItem('compareResult');
                if (!savedResult) {
                    alert('Результат не найден. Пожалуйста, выполните сравнение заново.');
                    return;
                }

                const resultData = JSON.parse(savedResult);
                button.disabled = true;
                button.innerText = format === 'pdf' ? '⏳ Генерация PDF...' : '⏳ Генерация HTML...';

                const endpoint = format === 'pdf' ? '/api/convert/pdf' : '/api/convert/html';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(resultData)
                });

                if (!response.ok) {
                    let errorText = await response.text();
                    throw new Error(`Ошибка ${response.status}: ${errorText.substring(0, 200)}`);
                }

                const blob = await response.blob();
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                const specialtyName = resultData.specialty ? resultData.specialty.replace(/[^a-zа-яё0-9]/gi, '_').substring(0, 50) : 'result';
                const filename = `${specialtyName}_${timestamp}_result.${format}`;

                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                alert(`✅ Файл ${format.toUpperCase()} успешно скачан!`);

            } catch (error) {
                console.error('Ошибка при скачивании:', error);
                alert(`❌ Не удалось скачать файл ${format.toUpperCase()}:\n${error.message}`);
            } finally {
                button.disabled = false;
                button.innerText = originalText;
            }
        };

        // ========== ЗАГРУЗКА И ОТОБРАЖЕНИЕ РЕЗУЛЬТАТА ==========
        try {
            var saved = localStorage.getItem('compareResult');
            if (saved && saved !== 'undefined' && saved !== 'null') {
                var parsedData = JSON.parse(saved);
                displayResult(parsedData);
            } else {
                showError('Результаты не найдены');
                resultContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">Вернитесь на главную страницу и отправьте данные заново</div>';
            }
        } catch(e) {
            console.error('Ошибка:', e);
            showError('Ошибка: ' + e.message);
        }
    </script>
</body>
</html>
